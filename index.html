<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koleje UK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12141b;
    --panel: #1b1e27;
    --panel-2: #21252f;
    --flap: #23262f;
    --flap-edge: #0d0e13;
    --amber: #f0a93e;
    --amber-dim: #a67527;
    --cream: #ece7da;
    --cream-dim: #9c9686;
    --green: #6fcf97;
    --green-dim: #2f5c46;
    --red: #e07a6e;
    --grey: #5b606d;
    --rule: #333844;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ink);
    color: var(--cream);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding: 20px 16px 40px;
    font-size: 13px;
  }
  .wrap{
    max-width: 780px;
    margin: 0 auto;
  }

  /* ---- Header ---- */
  header{
    margin-bottom: 14px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 4px;
  }
  a {
    color: skyblue;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 24px;
    margin: 0 0 20px;
    letter-spacing: -0.01em;
    color: var(--cream);
  }
  .sub{ display:none; }
  .meta-row{
    display:flex;
    align-items:center;
    gap: 12px;
    flex-wrap: wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--cream-dim);
    margin-bottom: 10px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background: var(--grey);
    display:inline-block;
    flex-shrink:0;
  }
  .dot.live{ background: var(--green); box-shadow: 0 0 8px rgba(111,207,151,0.7); animation: pulse 2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }
  #refreshBtn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    background: var(--amber);
    border: none;
    padding: 7px 14px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.04em;
    font-weight: 600;
    display: none;
  }
  #refreshBtn:hover{ background: #f7bb63; }
  #refreshBtn:focus-visible, a:focus-visible, button:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  /* ---- Summary banner ---- */
  .banner{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 5px;
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .banner.has-free{
    color: var(--green);
    background: rgba(111,207,151,0.1);
    border: 1px solid var(--green-dim);
  }
  .banner.none-free{
    color: #ffffff;
    background: #740f0f;
    border: 1px solid var(--rule);
  }
  .banner .colleges{
    display:block;
    font-weight: 400;
    color: var(--cream-dim);
    font-size: 11.5px;
    margin-top: 3px;
  }

  /* ---- Legend ---- */
  .legend{
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
    margin: 0 0 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--cream-dim);
  }
  .legend span{ display:flex; align-items:center; gap:5px; }
  .swatch{ width:8px; height:8px; border-radius:2px; display:inline-block; }

  /* ---- Board (college card) ---- */
  .board{
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 5px;
    margin-top: 10px;
    overflow: hidden;
  }
  .board-head{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    background: var(--panel-2);
  }
  .board-head h2{
    font-family:'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    color: var(--cream);
  }
  .board-head .id{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--cream-dim);
    white-space: nowrap;
  }

  table{
    width: 100%;
    border-collapse: collapse;
  }
  thead th{
    text-align: left;
    font-family:'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--cream-dim);
    font-weight: 500;
    padding: 5px 12px;
  }
  thead th.num, tbody td.num{ text-align: right; }
  tbody tr{
    border-top: 1px solid var(--rule);
  }
  tbody tr:hover{
    background: var(--panel-2);
  }
  tbody td{
    padding: 5px 12px;
    font-size: 12.5px;
    vertical-align: middle;
    line-height: 1.3;
  }
  td.room-name{
    color: var(--cream);
  }

  .price{
    font-family:'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--amber);
  }
  .price.na{ color: var(--grey); }

  .avail{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
  }
  .avail.open{ color: var(--green); }
  .avail.full{ color: var(--grey); }

  @media (max-width: 480px){
    tbody td, thead th{ padding: 5px 8px; }
    .board-head{ padding: 7px 8px; }
  }

  /* ---- States ---- */
  .state{
    text-align:center;
    padding: 70px 20px;
    color: var(--cream-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  .state .big{
    font-family:'Space Grotesk', sans-serif;
    font-size: 18px;
    color: var(--cream);
    margin-bottom: 8px;
  }
  .loading-flap{
    display:inline-block;
    margin-bottom: 18px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 28px;
    letter-spacing: 0.3em;
    color: var(--amber);
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink{ 50%{ opacity:0.25; } }
  .retry{
    margin-top: 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    background: var(--amber);
    border:none;
    padding: 8px 16px;
    border-radius: 3px;
    cursor:pointer;
    font-weight:600;
  }

  footer{
    margin-top: 50px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--grey);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Volná místa na kolejích UK</h1>
    <div class="meta-row">
      <span id="updatedAt"></span>
      <button id="refreshBtn">↻ Obnovit</button>
    </div>
  </header>

  <div id="banner"></div>

  <main id="content"></main>
</div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/vojtech-kult/dorm-monitor/main/dorms.json";
const content = document.getElementById('content');
const updatedAtEl = document.getElementById('updatedAt');
const refreshBtn = document.getElementById('refreshBtn');

function renderLoading(){
  content.innerHTML = `
    <div class="state">
      <div class="loading-flap">···</div>
      <div class="big">Načítám tabuli</div>
      <div>Stahuji aktuální data o kolejích</div>
    </div>`;
  updatedAtEl.textContent = '';
  document.getElementById('banner').innerHTML = '';
}

function renderError(err){
  content.innerHTML = `
    <div class="state">
      <div class="big">Tabuli se nepodařilo načíst</div>
      <div>${err && err.message ? escapeHtml(err.message) : 'Zkontrolujte připojení a zkuste to znovu.'}</div>
      <button class="retry" id="retryBtn">Zkusit znovu</button>
    </div>`;
  document.getElementById('banner').innerHTML = '';
  document.getElementById('retryBtn').addEventListener('click', load);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function fmtPrice(price){
  const n = Number(price);
  if(!n || n <= 0){
    return `<span class="price na">—</span>`;
  }
  return `<span class="price">${n.toLocaleString('cs-CZ')}</span>`;
}

function roomTotal(room){
  return (Number(room.men)||0) + (Number(room.women)||0) + (Number(room.unknown)||0);
}

function fmtAvail(room){
  const total = roomTotal(room);
  if(total <= 0){
    return `<span class="avail full">0</span>`;
  }
  return `<span class="avail open">${total}</span>`;
}

function renderData(payload){
  const colleges = (payload && payload.data) || [];
  if(colleges.length === 0){
    content.innerHTML = `<div class="state"><div class="big">Žádná data</div><div>Zdroj momentálně nevrací žádné koleje.</div></div>`;
    document.getElementById('banner').innerHTML = '';
    return;
  }

  // Build summary: total free spots + list of colleges with any free room
  let totalFree = 0;
  const freeColleges = [];
  colleges.forEach(college => {
    const collegeFree = (college.rooms || []).reduce((sum, r) => sum + roomTotal(r), 0);
    if(collegeFree > 0){
      totalFree += collegeFree;
      freeColleges.push(college.collegeName);
    }
  });

  const bannerEl = document.getElementById('banner');
  if(totalFree <= 0){
    bannerEl.innerHTML = `<div class="banner none-free">Všechna místa jsou obsazená</div>`;
  } else {
    bannerEl.innerHTML = `<div class="banner has-free">Nalezeno ${totalFree} volných míst na kolejích ${escapeHtml(freeColleges.join(', '))}</div>`;
  }

  content.innerHTML = colleges.map(college => {
    const rows = (college.rooms || []).map(room => `
      <tr>
        <td class="room-name">${escapeHtml(room.name || '')}</td>
        <td class="num">${fmtPrice(room.price)}</td>
        <td class="num">${fmtAvail(room)}</td>
      </tr>
    `).join('');

    return `
      <section class="board">
        <div class="board-head">
          <h2>${escapeHtml(college.collegeName || 'Kolej')}</h2>
          <a href="https://rehos.cuni.cz/crpp/eshop/collegeDetail/${escapeHtml(String(college.id || ''))}">odkaz</a>
        </div>
        <table>
          <thead>
            <tr>
              <th>Typ pokoje</th>
              <th class="num">Cena</th>
              <th class="num">Místa</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </section>
    `;
  }).join('');

  if(payload && payload.updatedAt){
    const d = new Date(payload.updatedAt);
    if(!isNaN(d)){
      updatedAtEl.textContent = 'Aktualizováno ' + d.toLocaleString('cs-CZ', {
        day: 'numeric', month: 'numeric', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }
  }
}

function load(){
  renderLoading();
  fetch(DATA_URL)
    .then(res => {
      if(!res.ok) throw new Error('Server odpověděl chybou ' + res.status);
      return res.json();
    })
    .then(renderData)
    .catch(renderError);
}

refreshBtn.addEventListener('click', load);
load();
</script>
</body>
</html>
